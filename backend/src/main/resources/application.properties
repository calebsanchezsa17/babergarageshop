# ==========================================
# SERVIDOR
# ==========================================
server.port=${PORT:8093}


# ==========================================
# BASE DE DATOS MYSQL
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/proyecto_barberia?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=always


# ==========================================
# JWT / SEGURIDAD
# ==========================================
# En Railway usar la variable JWT_SECRET con un secreto real.
# Este valor es solamente para desarrollo local.
app.jwt.secret=${JWT_SECRET:CHANGE_ME_DEV_ONLY_CHANGE_ME_DEV_ONLY_CHANGE_ME_1234567890}

# 12 horas
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:43200000}


# ==========================================
# CORS
# ==========================================
# Permite:
# 1. Frontend publicado en Railway
# 2. Frontend local con Vite
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://frontend-production-b2e4.up.railway.app,http://localhost:5173}


# ==========================================
# SERVICIO DE INTELIGENCIA ARTIFICIAL
# ==========================================
# En Railway AI_SERVICE_TOKEN debe tener
# exactamente el mismo valor que en AI-Service.
app.ai.service-token=${AI_SERVICE_TOKEN:dev-ai-token-change-me}


# ==========================================
# ADMINISTRADOR PRINCIPAL
# ==========================================
app.admin.username=${ADMIN_USERNAME:barbergarage}
app.admin.email=${ADMIN_EMAIL:barbergarage@gmail.com}
app.admin.password=${ADMIN_PASSWORD:barbergarage2026}
app.admin.full-name=${ADMIN_FULL_NAME:Administrador Barber Garage}


# ==========================================
# SEGURIDAD DE LOGIN
# ==========================================
# Máximo de intentos fallidos antes del bloqueo
app.login.max-failed-attempts=${MAX_FAILED_ATTEMPTS:3}

# Tiempo de bloqueo en minutos
app.login.lock-minutes=${LOCK_MINUTES:15}


# ==========================================
# ARCHIVOS / IMÁGENES
# ==========================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB