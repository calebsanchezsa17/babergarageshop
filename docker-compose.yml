services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: proyecto_barberia
      MYSQL_ROOT_PASSWORD: root
    ports: ["3307:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/proyecto_barberia?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: change-this-to-a-long-random-secret-at-least-32-bytes
      AI_SERVICE_TOKEN: local-ai-secret
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      ADMIN_USERNAME: barbergarage
      ADMIN_EMAIL: barbergarage@gmail.com
      ADMIN_PASSWORD: barbergarage2026
    ports: ["8093:8093"]
    depends_on: [mysql]
  ai:
    build: ./ai-service
    environment:
      BACKEND_URL: http://backend:8093
      AI_SERVICE_TOKEN: local-ai-secret
      MIN_SERVICE_SECONDS: 120
    ports: ["8000:8000"]
    depends_on: [backend]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8093
        VITE_AI_URL: http://localhost:8000
    ports: ["5173:80"]
    depends_on: [backend,ai]
volumes:
  mysql_data:
